# 检索与筛选配置（方案 B v2）
# 说明：城市名单只用于"过滤"；抓取时按 queries 组合检索，不要求渠道在这些城市。

cities:
  core: [北京, 上海, 深圳, 苏州]
  extended: [杭州, 东莞, 无锡, 常州, 嘉兴, 昆山, 太仓]

# 岗位族：白名单之外的岗位一律不推荐（但仍会进 raw/主库，方便回看）
job_families:
  include: [研发, 注册法规, 质量, 工艺制造, 技术支持]
  exclude: [临床医学, 销售市场, 职能]

experience:
  hard_block_years: 3
  relax_keywords: [应届, 优秀应届, 可放宽, 接受应届, 无经验, 不限经验, 实习转正]
  on_relax: review   # 命中放宽关键词 → 进人工复核队列，不直接丢

education:
  acceptable: [硕士, 本科, 不限]
  reject_keywords: [仅限博士, 仅招博士, 博士研究生]
  postdoc_keywords: [博士后, 博后, 博士后研究员, 博士后工作站]

crawl:
  concurrency: 4
  timeout_ms: 15000
  retries: 2
  raw_retention_days: 30
  max_pages_per_list: 5

queries:
  campus: [校园招聘, 校招, 应届, 2027届, 管培生, 培训生, 实习转正]
  suffix: [生物医学工程, 医疗器械, 材料, 结构, 仿真]
  city_suffix: [北京, 上海, 深圳, 苏州, 杭州, 东莞]
  daily_budget: 60        # 秋招季
  off_season_budget: 15   # 淡季
