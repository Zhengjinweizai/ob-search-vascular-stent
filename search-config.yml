# 每日搜索配置 —— 想改"搜什么/搜哪里/不搜什么"只改这个文件
# 修改后：本地直接跑 node search-engine.cjs check 验证；GitHub 覆盖该文件即可，其余文件不用动。

# 收录关键词：出现即进入采集范围（同时用于自动生成各平台搜索查询 + 正向标题筛选）
keywords:
  - 血管支架
  - 介入
  - 医疗器械
  - 可降解支架
  - 球囊
  - 导管
  - 镍钛
  - 药物涂层
  - 神经介入

# 排除词：命中即不收录
exclude:
  - 销售
  - 市场
  - 实习
  - 行政
  - 财务
  - 人事

# 城市范围（作为 AI 筛选提示，不改变评分权重）
cities:
  - 北京
  - 上海
  - 深圳
  - 苏州

# 采集重点岗位类型（作为 AI 筛选提示）
job_types:
  - 校园招聘
  - 应届生
  - 校招

# 自动生成查询：true 时按 keywords 为每个已有平台域名生成一条聚合查询（site:域名 关键词1 OR 关键词2 …）
# 关闭则只靠 portals.yml 原查询 + extra_queries
gen_queries: true

# 自动生成查询的固定后缀（可选，比如 研发 / 招聘）
query_suffix: 研发

# 整条自定义查询（最灵活，逐条追加）
extra_queries:
  - name: 自定义-密网支架
    query: "site:zhipin.com 密网支架 OR 血流导向 研发"
    enabled: true
