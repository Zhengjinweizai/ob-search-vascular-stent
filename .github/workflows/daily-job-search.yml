name: 每日招聘信息抓取

on:
  schedule:
    - cron: '0 0 * * *'   # 北京时间 08:00（GitHub 调度通常延迟 1–6 小时，实际约 09:00–14:00）
  workflow_dispatch:       # 支持手动触发

# 统一时区：所有 date 命令、脚本里的 new Date() 都按北京时间
env:
  TZ: Asia/Shanghai
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  DEEPSEEK_MODEL: deepseek-chat
  SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
  PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
  PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
  # 临时：旧 opencode 流程只有开启该变量才有 websearch（方案 B 落地后整体移除）
  OPENCODE_ENABLE_EXA: "1"

permissions:
  contents: write

# 避免手动触发与定时任务重叠
concurrency:
  group: daily-job-search
  cancel-in-progress: false

jobs:
  daily-job-search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装项目依赖（锁定版本）
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 运行每日任务AI抓取 + 智能匹配 + 生成CSV
        timeout-minutes: 15
        run: |
          opencode run --auto --format json < .opencode/daily-search-prompt.md

      - name: 生成 HTML 网页日报（GitHub Pages）
        run: node search-engine.cjs report

      # 先提交再推送：保证手机端 raw 链接拿到的是当天文件
      - name: 提交代码
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add 求职记录.xlsx 求职记录 index.html .nojekyll 2>/dev/null || true
          git diff --cached --quiet && echo "无变更可提交" && exit 0
          git commit -m "自动更新招聘信息 $(date +%F)"
          git pull --rebase --autostash origin main
          git push

      - name: 上传 Excel 并推微信日报
        timeout-minutes: 5
        run: node notify-job.cjs

      # 任何一步失败都推送告警（ServerChan 第一个 key），避免静默丢一天
      - name: 失败告警
        if: failure()
        run: |
          if [ -z "$SERVERCHAN_SENDKEY" ]; then
            echo "未配置 SERVERCHAN_SENDKEY，跳过告警"; exit 0
          fi
          KEY="${SERVERCHAN_SENDKEY%%,*}"
          curl -sS --max-time 10 "https://sctapi.ftqq.com/${KEY}.send" \
            --data-urlencode "title=❌ 求职日报运行失败 $(date +%F)" \
            --data-urlencode "desp=每日任务失败，请查看 GitHub Actions 日志：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            || true
          echo "已发送失败告警"
