<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4f5f7">
<title>私人备忘录</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
<style>
  :root{--ink:#1c1f24;--muted:#6b7280;--line:#e6e8ec;--red:#d92d20}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:#f4f5f7;color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .box{
    width:100%;max-width:340px;background:#fff;border-radius:20px;padding:30px 24px 24px;
    box-shadow:0 1px 2px rgba(16,24,40,.04),0 18px 40px -20px rgba(16,24,40,.22);text-align:center;
  }
  .lock{font-size:34px;line-height:1;margin:0 0 14px}
  h1{font-size:19px;margin:0 0 6px;letter-spacing:-.01em}
  p.sub{margin:0 0 20px;font-size:13px;color:var(--muted)}
  input{
    width:100%;font:inherit;font-size:20px;letter-spacing:.32em;text-align:center;
    padding:12px 10px;border:1.5px solid var(--line);border-radius:12px;background:#fbfcfd;
    outline:none;transition:.15s;-webkit-appearance:none
  }
  input:focus{border-color:#2e90fa;background:#fff;box-shadow:0 0 0 4px rgba(46,144,250,.12)}
  button{
    width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:#101828;color:#fff;
    font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:.15s
  }
  button:active{transform:scale(.985)}
  button:disabled{opacity:.55;cursor:default}
  .err{min-height:20px;margin:10px 0 0;font-size:13px;color:var(--red)}
  .tip{margin:14px 0 0;font-size:11.5px;color:#98a2b3;line-height:1.5}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="lock">🔒</div>
  <h1>私人备忘录</h1>
  <p class="sub">输入访问密码查看</p>
  <input id="pw" type="password" inputmode="numeric" autocomplete="off"
         autocapitalize="off" spellcheck="false" maxlength="16" placeholder="密码">
  <button id="go" type="button">打开</button>
  <p class="err" id="err"></p>
  <p class="tip">内容已加密，密码错误无法打开</p>
</div>
