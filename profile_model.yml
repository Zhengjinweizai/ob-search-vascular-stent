# 智能匹配能力模型（智能匹配基准）
# 用途：每日检索时作为匹配基准，对每个岗位按 5 个维度打分（每维 0-100），加权得出总分。
# 来源：config/profile.yml + cv.md 已知信息。可随时补充细节，补充后匹配会更准。

candidate:
  education:
    level: 硕士
    major: 生物医学工程
    current: 硕士在读/应届，可参加校园招聘
    research_direction: 血管支架
  headline: 生物医学工程硕士，研究方向为血管支架
  superpowers:
    - 材料学
    - 生物相容性评价
    - 支架设计
    - 动物实验
  target_roles:
    - 医疗器械研发工程师
    - 血管介入器械研发
    - 血管支架研发工程师
    - 博士后（血管支架/介入方向）

# 维度打分关键词（用于 AI 判断岗位与候选人的重合程度）
dimensions:
  research:            # 研究方向（权重 0.35）
    exact_keywords: [血管支架, 可降解支架, 全降解支架, 生物可吸收支架, 铁基支架, 药物涂层支架, 支架结构设计]
    related_keywords: [介入导管, 球囊, 神经介入, 冠脉器械, 输送系统, 血管介入, 介入医疗器械, 镍钛支架]
    # 打分参考：direct=90-100, related=80-89, 医疗器械泛方向=70-79, 其他生物医药=50-69, 无关=0-49
  skill:               # 技术技能（权重 0.30）
    skills:
      - name: 材料学
        keywords: [金属材料, 镍钛合金, 钴铬合金, 不锈钢, 高分子材料, 可降解材料, 聚合物, 材料性能测试]
      - name: 支架设计
        keywords: [结构设计, 力学仿真, 有限元, 三维建模, SolidWorks, 支架切割, 有限元分析]
      - name: 生物相容性评价
        keywords: [细胞毒性, 血液相容性, 溶血, 凝血, ISO 10993, 生物相容性, 降解性能]
      - name: 动物实验
        keywords: [动物实验, 植入实验, 动物模型, 猪, 兔, 组织切片, 影像学, 随访观察]
    # 打分参考：重合4项≈95-100, 3项≈85-94, 2项≈70-84, 1项≈55-69, 0项≈40-54
  education:           # 学历要求（权重 0.15）
    baseline: 硕士
    # 打分参考：硕士可投/应届/校招=100, 硕士优先=95-100, 本科及以上(硕士更佳)=90-100,
    #           博士优先但硕士可=85-89, 博士后可投=80-84, 仅博士=40-55, 本科即可=85-90
  industry:            # 行业（权重 0.10）
    perfect: [医疗器械, 生物医用材料, 心血管介入]
    related: [医药, 生物医药, 生物技术, 新材料]
    # 打分参考：医疗器械/生物医用材料=100, 相关=80-89, 其他=60-79, 无关=0-49
  company:             # 企业类型（权重 0.10）
    strong: [上市公司, 科创板, 细分龙头, 科研院所, 高校课题组, 医院课题组]
    good: [科创企业, 初创企业, 平台型大厂]
    # 打分参考：上市公司/科研院所/医院课题组=90-100, 科创企业=85-89, 相关企业=75-84, 其他=50-74

preferences:
  priority: 校园招聘/应届生岗位优先（当前为硕士应届）
  cities: [北京, 上海, 深圳, 苏州]
  willing_to_relocate: true
  exclude_types: [销售, 市场, 行政, 财务, 实习]

# 评分规则（权重合计 = 1.0）
scoring:
  weights:
    research: 0.35
    skill: 0.30
    education: 0.15
    industry: 0.10
    company: 0.10
  thresholds:
    strong_recommend: 80    # >= 80：强烈推荐（进「推荐投递」sheet、优先推送）
    worth_considering: 60   # 60-79：值得考虑（推送但不进推荐sheet）
    skip: 60                # < 60：暂不推荐（记录，不推送）
  formula: 总分 = round(研究方向*0.35 + 技能*0.30 + 学历*0.15 + 行业*0.10 + 企业类型*0.10)
