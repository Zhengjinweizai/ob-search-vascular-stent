# 候选人画像与评分口径（方案 B v2）
# 用途：① 生成检索词；② 给 DeepSeek 的评分 prompt 提供维度定义与锚点；③ 决定推荐门槛。
# 原则：门槛（是否推荐）由硬规则 + 岗位族决定，分数只用于排序和提示，不再用 80 分当推荐线。

candidate:
  degree: 硕士
  major: 生物医学工程
  graduation: 2027-06          # 毕业时间；校招年份以此为基准，若延期只改这里
  status: 在读应届
  direction: 血管支架研发
  city_preference: [北京, 上海, 深圳, 苏州, 杭州, 东莞, 无锡, 常州]
  willing_to_relocate: true

superpowers:
  - 材料学与生物相容性评价
  - 血管支架结构设计与力学分析（有限元、建模仿真、结构优化）
  - 体外性能测试与动物实验

target_roles:
  - 医疗器械研发工程师（血管介入 / 支架方向）
  - 血管支架研发工程师
  - 医疗器械结构/仿真工程师
  - 注册法规专员（医疗器械，可培养岗）
  - 质量工程师 / 工艺工程师（医疗器械，校招可投）
  - 技术支持 / 应用工程师（医疗器械）

# 六维评分：每维 0-100，必须附一句原文证据（evidence），否则视为无效评分
dimensions:
  family:
    desc: 岗位族是否在白名单内、是否与"医疗器械研发"直接相关
    anchors:
      - 血管支架/介入器械研发：90-100
      - 医疗器械其他研发（材料、结构、工艺）：80-89
      - 注塑/机械/电子等泛行业研发：60-79
      - 非白名单岗位族（临床/销售/职能等）：0-40
  skill:
    desc: 岗位要求与候选人技能栈的重合度
    keywords:
      strong: [支架设计, 结构设计, 力学仿真, 有限元, Ansys, Abaqus, 建模仿真, 三维建模, SolidWorks, 生物相容性, 材料学, 体外测试, 动物实验, 镍钛, 可降解]
      weak: [机械设计, 注塑, 电子, 软件, 注册申报, 质量体系]
    anchors:
      - 命中 ≥4 项强相关：90-100
      - 命中 3 项：80-89
      - 命中 2 项：70-79
      - 命中 1 项：55-69
      - 完全不相关：40-54
  campus:
    desc: 应届/校招友好度（校招专项、明确接受应届、无经验要求、有培养体系）
    anchors:
      - 明确校园招聘 / 2027 届专项：90-100
      - 标注"接受应届/1 年以内经验"：75-89
      - 未写经验要求但岗位偏初级：60-74
      - 明确要求 2 年以上经验：30-59
  location:
    desc: 工作城市是否在偏好名单内
    anchors:
      - core 城市（北京/上海/深圳/苏州）：90-100
      - extended 城市（杭州/东莞/无锡/常州/嘉兴/昆山/太仓）：75-89
      - 其他城市但可远程/可协商：40-60
      - 明确外地且不提供住宿：0-39
  company:
    desc: 公司平台与行业地位
    anchors:
      - 上市/细分龙头/科研院所/高校课题组：85-100
      - 科创板/知名初创/平台型大厂：70-84
      - 中小器械公司：55-69
      - 劳务派遣/外包/信息不明：0-54
  research:
    desc: 与"血管支架研发分析"研究方向的接近度（加分项，不再是核心权重）
    keywords:
      strong:
        - 血管支架
        - 支架
        - 心血管介入
        - 介入器械
        - 可降解支架
        - 全降解
        - 生物可吸收
        - 药物涂层
        - 镍钛
        - 密网支架
        - 取栓
        - 血流导向
      weak:
        - 导管
        - 球囊
        - 输送系统
        - 神经介入
        - 冠脉
        - 医用耗材
        - 医疗器械
    anchors:
      - 直接做支架/介入器械：85-100
      - 相邻领域（导管、球囊、神经介入）：70-84
      - 泛医疗器械：55-69
      - 无关：0-54

scoring:
  weights:
    family: 0.25
    skill: 0.25
    campus: 0.20
    location: 0.10
    company: 0.10
    research: 0.10
  formula: weighted_mean_round
  evidence_required_over: 60   # 单维超过该分数必须给出原文证据

thresholds:
  strong: 88        # 强推门槛（排序用，不是是否推荐的唯一标准）
  consider: 70      # 值得考虑
  daily_cap: 8      # 每天最多推荐条数（校招优先、截止日近的优先）

apply_advice:
  strong: 直接投，24 小时内完成
  consider: 看看 JD 细节，符合就投
  skip: 不投
