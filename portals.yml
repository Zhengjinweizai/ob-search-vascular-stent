    enabled: true
  - name: "川大就业网 — 医疗器械"
    query: 'site:jy.scu.edu.cn 医疗器械 OR 生物医学 OR 研发 招聘'
    enabled: true
  - name: "上海交大就业网 — 医疗器械"
    query: 'site:job.sjtu.edu.cn 医疗器械 OR 生物医学 OR 介入 招聘'
    enabled: true
  - name: "武大就业网 — 医疗器械"
    query: 'site:xsjy.whu.edu.cn 医疗器械 OR 生物医学 OR 研发 招聘'
    enabled: true
  - name: "北京化工大学就业网 — 医疗器械"
    query: 'site:career.buct.edu.cn 医疗器械 OR 生物医学 OR 材料 招聘'
    enabled: true
  - name: "吉林大学就业网 — 医疗器械"
    query: 'site:jdjyw.jlu.edu.cn 医疗器械 OR 生物医学 OR 研发 招聘'
    enabled: true
  - name: "北师大就业网 — 医疗器械"
    query: 'site:career.bnu.edu.cn 医疗器械 OR 生物医学 OR 研发 招聘'
    enabled: true
  - name: "中科大就业网 — 医疗器械"
    query: 'site:job.ustc.edu.cn 医疗器械 OR 生物医学 OR 研发 招聘'
    enabled: true

  # --- 主流招聘平台（新增） ---
  - name: "应届生求职网 — 血管介入"
    query: 'site:yingjiesheng.com 血管支架 OR 介入 OR 医疗器械 研发 应届生'
    enabled: true
  - name: "丁香人才 — 医疗器械研发"
    query: 'site:jobmd.cn 医疗器械 OR 介入器械 OR 血管支架 研发'
    enabled: true
  - name: "生物谷 — 医疗器械招聘"
    query: 'site:bioon.com 医疗器械 OR 生物医用材料 研发 招聘'
    enabled: true
  - name: "医药魔方 — 医疗器械招聘"
