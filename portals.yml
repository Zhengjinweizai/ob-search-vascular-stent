# Portal Scanner Configuration
# 血管支架/介入医疗器械 招聘信息来源配置
# 每日全量重搜模式：所有启用的查询/高校/公众号/企业每日都会检索，靠 Excel 去重

title_filter:
  positive:
    - "血管支架"
    - "介入"
    - "医疗器械"
    - "生物医用"
    - "支架"
    - "研发"
    - "材料"
    - "可降解"
    - "球囊"
    - "导管"
    - "镍钛"
    - "钴铬合金"
    - "瓣膜"
    - "封堵器"
    - "神经介入"
    - "冠脉"
    - "外周"
    - "药物涂层"
    - "输送系统"
    - "校园招聘"
    - "应届生"
    - "校招"
  negative:
    - "实习"
    - "初级"
    - "销售"
    - "市场"
    - "行政"
    - "财务"
    - "人事"
    - "实习生"

search_queries:
  # --- 主流招聘平台（原有） ---
  - name: "猎聘网 — 血管介入研发"
    query: 'site:liepin.com 血管支架 OR 介入器械 OR 全降解支架 研发'
    enabled: true
  - name: "前程无忧 — 医疗器械研发"
    query: 'site:51job.com 医疗器械 OR 介入器械 OR 血管支架 研发'
    enabled: true
  - name: "智联招聘 — 支架研发"
    query: 'site:zhaopin.com 血管支架 OR 全降解支架 OR 介入器械 研发'
    enabled: true
  - name: "猎聘网 — 材料研发"
    query: 'site:liepin.com 医疗器械 生物医用材料 OR 生物相容性 研发工程师'
    enabled: true
  - name: "前程无忧 — 介入耗材"
    query: 'site:51job.com 介入耗材 OR 球囊 OR 导管 研发'
    enabled: true
  - name: "智联招聘 — 医疗器械研发"
    query: 'site:zhaopin.com 医疗器械 研发工程师 OR 介入 研发'
    enabled: true
  - name: "BOSS直聘 — 血管介入"
    query: 'site:zhipin.com 血管支架 OR 介入器械 研发'
    enabled: true
  - name: "BOSS直聘 — 医疗器械"
    query: 'site:zhipin.com 医疗器械 研发 支架 OR 介入'
    enabled: true
  - name: "猎聘网 — 神经介入"
    query: 'site:liepin.com 神经介入 支架 OR 密网支架 OR 取栓支架'
    enabled: true
  - name: "智联招聘 — 可降解支架"
    query: 'site:zhaopin.com 可降解支架 OR 全降解 冠脉支架 OR 药物球囊'
    enabled: true

  # --- 国家级平台 ---
  - name: "国家大学生就业服务平台 — 血管介入"
    query: 'site:ncss.cn 血管支架 OR 介入 OR 医疗器械 校园招聘 OR 应届生'
    enabled: true
  - name: "中国公共招聘网 — 医疗器械研发"
    query: 'site:mohrss.gov.cn 医疗器械 OR 介入 OR 生物医用材料 招聘'
    enabled: true
  - name: "国聘网 — 血管支架研发"
    query: 'site:iguopin.com 血管支架 OR 介入器械 OR 医疗器械 研发'
    enabled: true
  - name: "高校人才网 — 生物医用材料"
    query: 'site:gaoxiaojob.com 生物医用材料 OR 介入器械 OR 医疗器械 研发'
    enabled: true

  # --- 目标高校就业网 ---
  - name: "中科院大学就业网 — 医疗器械"
    query: 'site:job.ucas.ac.cn 医疗器械 OR 生物医学 OR 研发 招聘'
    enabled: true
  - name: "清华就业网 — 医疗器械"
