    enabled: true
  - name: "公众号 — 高才医学"
    query: 'site:mp.weixin.qq.com "高才医学" 医疗器械 OR 介入 OR 研发'
    enabled: true
  - name: "公众号 — BioArt"
    query: 'site:mp.weixin.qq.com "BioArt" 医疗器械 OR 生物医学 OR 博后 OR 招聘'
    enabled: true
  - name: "公众号 — iNature"
    query: 'site:mp.weixin.qq.com "iNature" 医疗器械 OR 生物材料 OR 招聘'
    enabled: true
  - name: "公众号 — 生物制药小编"
    query: 'site:mp.weixin.qq.com "生物制药小编" 医疗器械 OR 介入 OR 研发'
    enabled: true
  - name: "公众号 — 生物探索"
    query: 'site:mp.weixin.qq.com "生物探索" 医疗器械 OR 生物医用材料 OR 招聘'
