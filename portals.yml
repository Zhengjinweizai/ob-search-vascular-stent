# Portal Scanner Configuration
# 血管支架/介入医疗器械 招聘信息来源配置
# 每日全量重搜模式：所有启用的查询/高校/公众号/企业每日都会检索，靠 Excel 去重

title_filter:
  positive:
    - "血管支架"
    - "介入"
    - "医疗器械"
    - "生物医用"
    - "支架"
    - "研发"
    - "材料"
    - "可降解"
    - "球囊"
    - "导管"
    - "镍钛"
    - "钴铬合金"
    - "瓣膜"
    - "封堵器"
    - "神经介入"
    - "冠脉"
    - "外周"
    - "药物涂层"
    - "输送系统"
    - "校园招聘"
    - "应届生"
    - "校招"
  negative:
    - "实习"
    - "初级"
    - "销售"
    - "市场"
    - "行政"
    - "财务"
    - "人事"
    - "实习生"

